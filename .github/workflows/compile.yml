name: Compile and Release Firmware

on:
  push:
    tags:
      - 'v*' # Срабатывает при создании тега версии, например v1.0.0, v1.1.0
  workflow_dispatch: # Позволяет запустить сборку вручную кнопкой на сайте GitHub

permissions:
  contents: write # Дает право GitHub Actions создавать релизы и загружать файлы

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node: '3.10'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Compile Firmware for all boards
      run: |
        pio run

    - name: Rename and Prepare Binaries
      run: |
        mkdir -p output_bins
        cp .pio/build/super_mini_c3/firmware.bin output_bins/esp32_c3_supermini_test.bin
        cp .pio/build/super_mini_c6/firmware.bin output_bins/esp32_c6_supermini_test.bin
        cp .pio/build/super_mini_s3/firmware.bin output_bins/esp32_s3_supermini_test.bin
        cp .pio/build/super_mini_h2/firmware.bin output_bins/esp32_h2_supermini_test.bin

    - name: Create GitHub Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          output_bins/esp32_c3_supermini_test.bin
          output_bins/esp32_c6_supermini_test.bin
          output_bins/esp32_s3_supermini_test.bin
          output_bins/esp32_h2_supermini_test.bin
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
