[env]
; Подключаем платформу PioArduino через прямую ссылку на стабильный архив
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = default.csv
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:super_mini_c6]
board = esp32-c6-devkitm-1
build_flags = ${env.build_flags} -D IS_BOARD_C6

[env:super_mini_c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -D IS_BOARD_C3

[env:super_mini_s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D IS_BOARD_S3

[env:super_mini_h2]
board = esp32-h2-devkitc-1
build_flags = ${env.build_flags} -D IS_BOARD_H2
